services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/support
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    environment:
      VITE_API_URL: http://localhost:8000/api
    depends_on:
      backend:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: support
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes: [support_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d support"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  support_data:
