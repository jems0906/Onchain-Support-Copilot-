services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/support
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: support
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes: [support_data:/var/lib/postgresql/data]
volumes:
  support_data:
